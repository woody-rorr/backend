name: Deploy backend to ECS

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'deploy/Dockerfile'
      - 'deploy/entrypoint.sh'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPO: backend-api
  ECR_REGISTRY: 239460481239.dkr.ecr.us-east-1.amazonaws.com
  CLUSTER: mcp-agents-staging-cluster
  SERVICE: backend-api-service

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: http://mcp-agents-staging-alb-249976027.us-east-1.elb.amazonaws.com:5013/health
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Check prerequisites
        id: check
        run: |
          missing=""
          for f in deploy/Dockerfile deploy/entrypoint.sh package.json; do
            if [ ! -f "$f" ]; then missing="$missing $f"; fi
          done
          if [ -n "$missing" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping deploy. Missing required files:$missing"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # MCP scaffold 산출물에는 lock 파일이 없으므로, 빌드 직전 자동 생성.
      # 운영자가 로컬 npm install 후 lock 을 커밋하면 이 단계는 no-op.
      - name: Setup Node
        if: steps.check.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate lockfile if missing
        if: steps.check.outputs.ready == 'true'
        run: |
          if [ ! -f package-lock.json ]; then
            echo "::warning::package-lock.json missing — generating on the fly"
            npm install --package-lock-only --no-audit --no-fund
          else
            echo "package-lock.json present — skipping"
          fi

      - name: Configure AWS via OIDC
        if: steps.check.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::239460481239:role/github-actions-rorr-mcp
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR login
        if: steps.check.outputs.ready == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        if: steps.check.outputs.ready == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build & push image
        if: steps.check.outputs.ready == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:latest
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ github.sha }}

      - name: Force new ECS deployment
        if: steps.check.outputs.ready == 'true'
        run: |
          aws ecs update-service \
            --cluster $CLUSTER \
            --service $SERVICE \
            --force-new-deployment \
            --region $AWS_REGION > /dev/null

      - name: Done
        run: |
          if [ "${{ steps.check.outputs.ready }}" = "true" ]; then
            echo "Deployment triggered: $ECR_REGISTRY/$ECR_REPO:${{ github.sha }}"
            echo "Health: http://mcp-agents-staging-alb-249976027.us-east-1.elb.amazonaws.com:5013/health"
          else
            echo "Skipped (prerequisites missing)."
          fi
