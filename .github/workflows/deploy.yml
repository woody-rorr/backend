name: Deploy backend to ECS

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'deploy/Dockerfile'
      - 'deploy/entrypoint.sh'
      - 'deploy/migrate-task-def.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPO: backend-api
  ECR_REGISTRY: 239460481239.dkr.ecr.us-east-1.amazonaws.com
  CLUSTER: mcp-agents-staging-cluster
  SERVICE: backend-api-service

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: http://mcp-agents-staging-alb-249976027.us-east-1.elb.amazonaws.com:5013/health
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Check prerequisites
        id: check
        run: |
          missing=""
          for f in deploy/Dockerfile deploy/entrypoint.sh deploy/migrate-task-def.json package.json; do
            if [ ! -f "$f" ]; then missing="$missing $f"; fi
          done
          if [ -n "$missing" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping deploy. Missing required files:$missing"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.check.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate lockfile if missing
        if: steps.check.outputs.ready == 'true'
        run: |
          if [ ! -f package-lock.json ]; then
            echo "::warning::package-lock.json missing — generating on the fly"
            npm install --package-lock-only --no-audit --no-fund
          else
            echo "package-lock.json present — skipping"
          fi

      - name: Configure AWS via OIDC
        if: steps.check.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::239460481239:role/github-actions-rorr-mcp
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR login
        if: steps.check.outputs.ready == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        if: steps.check.outputs.ready == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build & push image
        if: steps.check.outputs.ready == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:latest
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPO }}:${{ github.sha }}

      # === migrate-runner: build/push 후, update-service 전에 마이그레이션 선행 실행 ===
      - name: Register migrate task definition
        if: steps.check.outputs.ready == 'true'
        id: register-migrate
        run: |
          TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://deploy/migrate-task-def.json \
            --region $AWS_REGION \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "task_def_arn=$TASK_DEF_ARN" >> $GITHUB_OUTPUT
          echo "Registered: $TASK_DEF_ARN"

      - name: Run database migration
        if: steps.check.outputs.ready == 'true'
        id: run-migrate
        run: |
          TASK_ARN=$(aws ecs run-task \
            --cluster $CLUSTER \
            --task-definition ${{ steps.register-migrate.outputs.task_def_arn }} \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ secrets.ECS_SUBNETS }}],securityGroups=[${{ secrets.ECS_SECURITY_GROUPS }}],assignPublicIp=ENABLED}" \
            --region $AWS_REGION \
            --query 'tasks[0].taskArn' --output text)
          echo "task_arn=$TASK_ARN" >> $GITHUB_OUTPUT
          echo "Started migration task: $TASK_ARN"

      - name: Wait for migration to complete
        if: steps.check.outputs.ready == 'true'
        run: |
          aws ecs wait tasks-stopped \
            --cluster $CLUSTER \
            --tasks ${{ steps.run-migrate.outputs.task_arn }} \
            --region $AWS_REGION

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster $CLUSTER \
            --tasks ${{ steps.run-migrate.outputs.task_arn }} \
            --region $AWS_REGION \
            --query 'tasks[0].containers[0].exitCode' --output text)

          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::Migration failed with exit code $EXIT_CODE"
            echo "⚠️  앱 배포 중단 — 기존 버전은 계속 운영"
            echo "로그: /ecs/backend-api-migrate (CloudWatch)"
            exit 1
          fi
          echo "✅ Migration succeeded"
      # === migrate-runner end ===

      - name: Set health check grace period
        if: steps.check.outputs.ready == 'true'
        run: |
          aws ecs update-service \
            --cluster $CLUSTER \
            --service $SERVICE \
            --health-check-grace-period-seconds 120 \
            --region $AWS_REGION > /dev/null

      - name: Force new ECS deployment
        if: steps.check.outputs.ready == 'true'
        run: |
          aws ecs update-service \
            --cluster $CLUSTER \
            --service $SERVICE \
            --force-new-deployment \
            --region $AWS_REGION > /dev/null

      - name: Done
        run: |
          if [ "${{ steps.check.outputs.ready }}" = "true" ]; then
            echo "Deployment triggered: $ECR_REGISTRY/$ECR_REPO:${{ github.sha }}"
            echo "Health: http://mcp-agents-staging-alb-249976027.us-east-1.elb.amazonaws.com:5013/health"
          else
            echo "Skipped (prerequisites missing)."
          fi
